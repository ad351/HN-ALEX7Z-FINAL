name: Build IPA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build REAL iPhone FIX
        run: |
          set -ex
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc -parse-as-library -sdk $SDK -target arm64-apple-ios17.0 -o HackApp ContentView.swift
          mkdir -p Payload/HackApp.app
          mv HackApp Payload/HackApp.app/
          echo "APPL????" > Payload/HackApp.app/PkgInfo
          cat > Payload/HackApp.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>HackApp</string>
            <key>CFBundleIdentifier</key><string>com.hn.alex7z</string>
            <key>CFBundleName</key><string>HN-ALEX7Z</string>
            <key>CFBundleVersion</key><string>1.0</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchStoryboardName</key><string></string>
          </dict></plist>
          EOF
          zip -r HN-ALEX7Z.ipa Payload
          ls -lh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HN-ALEX7Z-IPA
          path: HN-ALEX7Z.ipa
