name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Build EXTERNAL RAINBOW REAL
        run: |
          cat ContentView.swift
          echo "=== Building ==="
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun --sdk iphonesimulator swiftc -parse-as-library -o HackApp -target arm64-apple-ios16.0-simulator ContentView.swift -sdk $SDK -framework SwiftUI
          mkdir -p Payload/HackApp.app
          mv HackApp Payload/HackApp.app/
          echo "APPL????" > Payload/HackApp.app/PkgInfo
          cat > Payload/HackApp.app/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>HackApp</string>
          <key>CFBundleIdentifier</key><string>com.hnalex7z.rainbow</string>
          <key>CFBundleName</key><string>HN-ALEX7z</string>
          <key>CFBundleVersion</key><string>1.0</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSRequiresIPhoneOS</key><true/>
          <key>UILaunchStoryboardName</key><string></string>
          </dict></plist>
          PLIST
          zip -r HN-ALEX7z-EXTERNAL-RAINBOW.ipa Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HN-ALEX7z-EXTERNAL-RAINBOW
          path: "*.ipa"
