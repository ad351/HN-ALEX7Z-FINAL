name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA Manually (no xcodeproj)
        run: |
          rm -rf build Payload *.ipa
          rm -rf HN-ALEX7Z-FINAL/build
          mkdir -p HN-ALEX7Z-FINAL
          cat > HN-ALEX7Z-FINAL/HNApp.swift <<'SWIFT'
          import SwiftUI
          @main
          struct HNApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          SWIFT
          cat > HN-ALEX7Z-FINAL/ContentView.swift <<'SWIFT'
          import SwiftUI
          struct ContentView: View {
              var body: some View {
                  VStack(spacing:20){
                      Text("HN-ALEX7Z-FINAL").font(.largeTitle).bold()
                      Text("Build OK! IPA Manual").foregroundColor(.green)
                      Text("No Xcode Project Needed")
                  }.padding()
              }
          }
          SWIFT
          mkdir -p Payload/HN-ALEX7Z-FINAL.app
          cat > Payload/HN-ALEX7Z-FINAL.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>com.ad351.HN-ALEX7Z-FINAL</string>
          <key>CFBundleName</key><string>HN-ALEX7Z-FINAL</string>
          <key>CFBundleDisplayName</key><string>HN-ALEX7Z-FINAL</string>
          <key>CFBundleExecutable</key><string>HN-ALEX7Z-FINAL</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1.0</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>LSRequiresIPhoneOS</key><true/>
          <key>UILaunchStoryboardName</key><string></string>
          <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
          <key>MinimumOSVersion</key><string>16.0</string>
          </dict></plist>
          PLIST
          echo "APPL????" > Payload/HN-ALEX7Z-FINAL.app/PkgInfo
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.0 -O -o Payload/HN-ALEX7Z-FINAL.app/HN-ALEX7Z-FINAL HN-ALEX7Z-FINAL/*.swift -Xlinker -rpath -Xlinker @executable_path/Frameworks
          chmod +x Payload/HN-ALEX7Z-FINAL.app/HN-ALEX7Z-FINAL
          ls -lh Payload/HN-ALEX7Z-FINAL.app/
          file Payload/HN-ALEX7Z-FINAL.app/HN-ALEX7Z-FINAL
          zip -r HN-ALEX7Z-FINAL.ipa Payload
          ls -lh *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: HN-ALEX7Z-FINAL-IPA
          path: HN-ALEX7Z-FINAL.ipa
